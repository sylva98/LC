<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画册后台管理</title>
  <script src="supabase.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      overflow: hidden;
    }

    /* ===== 列表视图 ===== */
    .view-list {
      height: 100vh;
      overflow-y: auto;
      padding: 40px 60px;
      background: #f5f5f5;
    }
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .list-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a2e;
    }
    .list-header .btn-primary {
      padding: 12px 24px;
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .list-header .btn-primary:hover { background: #d62839; transform: translateY(-1px); }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }
    .filter-row input[type="text"] {
      padding: 8px 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      color: #333;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .filter-row input[type="text"]:focus {
      border-color: #e63946;
      box-shadow: 0 0 0 2px rgba(230, 57, 70, 0.12);
    }
    .cselect { position: relative; }
    .cselect-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      color: #333;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .cselect-btn:hover { border-color: #c0c0c0; }
    .cselect-btn.active,
    .cselect-btn:focus-within { border-color: #e63946; box-shadow: 0 0 0 2px rgba(230, 57, 70, 0.12); }
    .cselect-arrow { flex-shrink: 0; }
    .cselect-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      display: none;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      z-index: 300;
      overflow: hidden;
      padding: 4px 0;
    }
    .cselect-option {
      padding: 8px 12px;
      font-size: 13px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    .cselect-option:hover { background: #f5f5f5; color: #e63946; }
    .filter-search { display: flex; }
    .filter-search input[type="text"] {
      width: 180px;
      border-radius: 6px 0 0 6px;
      border-right: none;
      padding-right: 32px;
    }
    .filter-search .clear-keyword {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      line-height: 1;
      display: none;
    }
    .filter-search .clear-keyword:hover { color: #333; }
    .filter-search button {
      padding: 8px 14px;
      background: #e63946;
      border: none;
      border-radius: 0 6px 6px 0;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .filter-search button:hover { background: #d62839; }
    .filter-count {
      margin-left: auto;
      font-size: 12px;
      color: #999;
      white-space: nowrap;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }
    .book-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: all .25s;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .book-cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #e8e8e8;
      overflow: hidden;
      position: relative;
    }
    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* HTML 封面（模板）：cqw 按卡片宽度缩放，Shadow DOM 注入 */
    .book-cover-html {
      width: 100%;
      height: 100%;
      container-type: inline-size;
    }
    .book-cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: #ccc;
      background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
    }
    .book-info {
      padding: 16px;
    }
    .book-name {
      font-size: 15px;
      font-weight: 700;
      color: #222;
      margin-bottom: 4px;
    }
    .book-meta {
      font-size: 12px;
      color: #999;
    }
    .book-actions {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
    }
    .book-actions button {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
    }
    .book-actions button:hover { background: #f5f5f5; }
    .book-actions button.danger:hover { background: #e63946; color: #fff; border-color: #e63946; }
    /* 精选序号角标 */
    .cover-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(230, 57, 70, 0.92);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      z-index: 2;
      letter-spacing: 0.05em;
    }
    /* 封面上移/下移浮标 */
    .cover-move {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 5px;
      z-index: 2;
    }
    .cover-move button {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      color: #666;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      transition: all .15s;
    }
    .cover-move button:hover { background: #e63946; color: #fff; }

    /* ===== 编辑视图 ===== */
    .view-edit {
      display: flex;
      height: 100vh;
    }

    /* ===== 左侧配置面板 ===== */
    .sidebar {
      width: 380px;
      min-width: 380px;
      background: #1e1e2e;
      color: #ddd;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .sidebar-actions {
      display: flex;
      gap: 8px;
    }
    .sidebar-actions button {
      padding: 6px 12px;
      border: 1px solid #444;
      background: transparent;
      color: #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all .2s;
    }
    .sidebar-actions button:hover { background: #333; color: #fff; }
    .sidebar-actions button.primary {
      background: #e63946;
      border-color: #e63946;
      color: #fff;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .sidebar-body::-webkit-scrollbar { width: 6px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .section {
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #333;
    }

    .form-row {
      margin-bottom: 12px;
    }
    .form-row {
      margin-bottom: 20px;
    }
    .form-row label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-row input[type="text"],
    .form-row input[type="number"],
    .form-row input[type="url"],
    .form-row select,
    .form-row textarea {
      width: 100%;
      padding: 8px 10px;
      background: #2a2a3c;
      border: 1px solid #3a3a4c;
      border-radius: 4px;
      color: #eee;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      border-color: #e63946;
    }
    .form-row textarea {
      min-height: 80px;
      resize: vertical;
      font-family: "SF Mono", Monaco, monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .form-row input[type="color"] {
      width: 100%;
      height: 36px;
      border: 1px solid #3a3a4c;
      border-radius: 4px;
      background: #2a2a3c;
      cursor: pointer;
    }

    /* 自定义勾选框：带对勾的图标样式 */
    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #2a2a3c;
      cursor: pointer;
      position: relative;
      vertical-align: middle;
      margin: 0;
      flex-shrink: 0;
    }
    input[type="checkbox"]:checked {
      background: #6c5ce7;
      border-color: #6c5ce7;
    }
    input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .form-row-inline {
      display: flex;
      gap: 8px;
    }
    .form-row-inline > div { flex: 1; }

    /* ===== 页面卡片 ===== */
    .page-card {
      background: #2a2a3c;
      border: 1px solid #3a3a4c;
      border-radius: 8px;
      padding: 16px 16px 12px;
      margin-bottom: 16px;
      position: relative;
    }
    .page-card .form-row {
      margin-bottom: 0;
    }
    .page-card .form-row label {
      margin-bottom: 6px;
    }
    .page-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .page-card-title {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
    }
    .page-card-actions {
      display: flex;
      gap: 4px;
    }
    .page-card-actions button {
      width: 24px;
      height: 24px;
      border: none;
      background: #3a3a4c;
      color: #999;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-card-actions button:hover { background: #4a4a5c; color: #fff; }
    .page-card-actions button.delete:hover { background: #e63946; }

    .add-page-btn {
      width: 100%;
      padding: 10px;
      border: 1px dashed #4a4a5c;
      background: transparent;
      color: #888;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all .2s;
    }
    .add-page-btn:hover {
      border-color: #e63946;
      color: #e63946;
    }

    .type-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 8px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #3a3a4c;
    }
    .type-toggle button {
      flex: 1;
      padding: 6px;
      border: none;
      background: #2a2a3c;
      color: #888;
      cursor: pointer;
      font-size: 11px;
      transition: all .2s;
    }
    .type-toggle button.active {
      background: #e63946;
      color: #fff;
    }

    /* ===== 右侧预览区 ===== */
    .preview-area {
      flex: 1;
      background: #ddd;
      position: relative;
    }
    .preview-area iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .preview-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      pointer-events: none;
    }

    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      line-height: 1.4;
    }

    .upload-btn {
      margin-top: 6px;
      width: 100%;
      padding: 8px;
      border: 1px dashed #4a4a5c;
      background: transparent;
      color: #888;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all .2s;
    }
    .upload-btn:hover {
      border-color: #e63946;
      color: #e63946;
    }

    /* 画册选择器 */
    .book-selector {
      padding: 12px 16px;
      background: #181825;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .book-selector select {
      flex: 1;
      padding: 8px 10px;
      background: #2a2a3c;
      border: 1px solid #3a3a4c;
      border-radius: 4px;
      color: #eee;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .book-selector button {
      padding: 8px 10px;
      border: 1px solid #3a3a4c;
      background: #2a2a3c;
      color: #aaa;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all .2s;
    }
    .book-selector button:hover { background: #3a3a4c; color: #fff; }
    .book-selector button.danger:hover { background: #e63946; border-color: #e63946; }
  </style>
</head>
<body>

<!-- 登录界面 -->
<div id="loginView" style="display:flex; position:fixed; top:0; left:0; right:0; bottom:0; background:#12121f; z-index:9999; justify-content:center; align-items:center;">
  <div style="background:#1a1a2e; padding:40px; border-radius:12px; width:90%; max-width:360px;">
    <h2 style="margin:0 0 24px; color:#fff; font-size:20px; text-align:center;">管理后台登录</h2>
    <div style="margin-bottom:16px;">
      <input type="text" id="loginUser" placeholder="账号" style="width:100%; padding:12px; background:#0f0f1a; border:1px solid #333; border-radius:6px; color:#fff; font-size:14px; box-sizing:border-box;">
    </div>
    <div style="margin-bottom:24px;">
      <input type="password" id="loginPass" placeholder="密码" style="width:100%; padding:12px; background:#0f0f1a; border:1px solid #333; border-radius:6px; color:#fff; font-size:14px; box-sizing:border-box;" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button onclick="doLogin()" style="width:100%; padding:12px; background:#6c5ce7; border:none; border-radius:6px; color:#fff; font-size:14px; cursor:pointer;">登录</button>
    <div id="loginError" style="color:#e74c3c; font-size:12px; text-align:center; margin-top:12px; display:none;">账号或密码错误</div>
  </div>
</div>

  <!-- ===== 列表视图 ===== -->
  <div id="viewList" class="view-list" style="display:none">
    <div class="list-header">
      <h1>我的画册</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <button onclick="window.open('index.html', '_blank')" style="padding:10px 16px; background:#333; border:none; border-radius:6px; color:#aaa; cursor:pointer; font-size:13px;">首页</button>
        <button onclick="openAssets()" style="padding:10px 16px; background:#333; border:none; border-radius:6px; color:#aaa; cursor:pointer; font-size:13px;">素材库 ▾</button>
        <div style="position:relative;">
          <button onclick="toggleSettingsMenu(event)" style="padding:10px 16px; background:#333; border:none; border-radius:6px; color:#aaa; cursor:pointer; font-size:13px;">设置 ▾</button>
          <div id="settingsDropdown" style="display:none; position:absolute; top:100%; right:0; margin-top:6px; background:#1a1a2e; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.3); min-width:140px; overflow:hidden; z-index:100;">
            <div onclick="closeSettingsMenu(); openChangePass();" style="padding:10px 16px; color:#ccc; cursor:pointer; font-size:13px;">修改密码</div>
            <div onclick="closeSettingsMenu(); logout();" style="padding:10px 16px; color:#ccc; cursor:pointer; font-size:13px; border-top:1px solid #333;">退出登录</div>
          </div>
        </div>
        <button class="btn-primary" onclick="newBook()">+ 新建画册</button>
      </div>
    </div>
    <div class="filter-row" id="filterRow">
      <div class="cselect" id="csCategory" title="按分类筛选">
        <div class="cselect-btn" onclick="toggleCSelect('csCategory', event)">
          <span class="cselect-label" id="csCategoryLabel">全部分类</span>
          <svg class="cselect-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="cselect-panel" id="csCategoryPanel"></div>
      </div>
      <div class="cselect" id="csSort" title="排序方式">
        <div class="cselect-btn" onclick="toggleCSelect('csSort', event)">
          <span class="cselect-label" id="csSortLabel">最新发布</span>
          <svg class="cselect-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="cselect-panel" id="csSortPanel"></div>
      </div>
      <div class="cselect" id="csDevice" title="显示端筛选">
        <div class="cselect-btn" onclick="toggleCSelect('csDevice', event)">
          <span class="cselect-label" id="csDeviceLabel">全部显示端</span>
          <svg class="cselect-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="cselect-panel" id="csDevicePanel"></div>
      </div>
      <div class="cselect" id="csFeatured" title="推荐状态">
        <div class="cselect-btn" onclick="toggleCSelect('csFeatured', event)">
          <span class="cselect-label" id="csFeaturedLabel">全部状态</span>
          <svg class="cselect-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="cselect-panel" id="csFeaturedPanel"></div>
      </div>
      <div class="filter-search">
        <div style="position:relative;">
          <input type="text" id="filterKeyword" placeholder="搜索画册名称">
          <button class="clear-keyword" id="clearKeyword" onclick="clearKeyword()" title="清空">✕</button>
        </div>
        <button onclick="applyFilter()">搜索</button>
      </div>
      <span class="filter-count" id="filterCount">共 0 本</span>
    </div>
    <div class="books-grid" id="booksGrid"></div>
  </div>

  <!-- ===== 编辑视图 ===== -->
  <div id="viewEdit" class="view-edit" style="display:none">

  <!-- 左侧配置面板 -->
  <div class="sidebar">
    <div class="sidebar-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 style="cursor:pointer; margin:0; font-size:18px;" onclick="showListView()" title="返回列表">← 返回</h1>
      <div class="sidebar-actions" style="display:flex; gap:10px; align-items:center;">
        <div style="position:relative;">
          <button onclick="toggleImportMenu(event)" style="padding:8px 14px; font-size:13px;">批量导入 ▾</button>
          <div id="importDropdown" style="display:none; position:absolute; top:100%; right:0; margin-top:6px; background:#1a1a2e; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.3); min-width:150px; overflow:hidden; z-index:200;">
            <div onclick="closeImportMenu(); document.getElementById('importImages').click();" style="padding:10px 14px; color:#ccc; cursor:pointer; font-size:13px;">批量导入图片</div>
            <div onclick="closeImportMenu(); openLinksImporter();" style="padding:10px 14px; color:#ccc; cursor:pointer; font-size:13px; border-top:1px solid #333;">批量链接导入</div>
          </div>
        </div>
        <input type="file" id="importImages" accept="image/*" multiple style="display:none" onchange="importImages(event)">
        <button class="primary" onclick="openPreview()" style="padding:8px 14px; font-size:13px;">预览 ↗</button>
      </div>
    </div>

    <div class="sidebar-body">

      <!-- 全局设置 -->
      <div class="section">
        <div class="section-title">全局设置</div>

        <div class="form-row">
          <label>背景</label>
          <div style="display:flex; gap:12px; margin-top:2px;">
            <div id="bgThumb" onclick="document.getElementById('bgUpload').click()" title="点击上传背景图" style="width:64px; height:80px; border-radius:4px; overflow:hidden; background:#2a2a3c; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; border:1px solid #3a3a4c;">
              <span style="font-size:10px; color:#666;">空</span>
            </div>
            <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
              <div style="display:flex; gap:6px; align-items:center;">
                <input type="text" id="bgImage" placeholder="粘贴链接或上传" oninput="updateConfig(); updateBgThumb();" style="flex:1; margin:0;">
                <button class="upload-btn" style="margin:0; width:auto; padding:0 10px; flex-shrink:0; height:36px; display:flex; align-items:center; justify-content:center;" onclick="document.getElementById('bgUpload').click()">📁</button>
              </div>
              <div>
                <input type="color" id="bgColor" onchange="updateConfig()" style="width:100%; height:32px;">
              </div>
            </div>
          </div>
          <input type="file" id="bgUpload" accept="image/*" style="display:none" onchange="handleBgUpload(event)">
        </div>

        <div class="form-row">
          <label>画册比例（单页宽 : 高）</label>
          <div class="form-row-inline">
            <div>
              <input type="number" id="ratioW" value="420" onchange="updateConfig()">
            </div>
            <div>
              <input type="number" id="ratioH" value="560" onchange="updateConfig()">
            </div>
          </div>
          <div class="hint">比如 420:560 = 3:4 竖版；600:450 = 4:3 横版</div>
        </div>

        <div class="form-row">
          <label>显示设置</label>
          <div style="display:flex; align-items:center; gap:24px; margin-top:2px;">
            <label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:normal;">
              <input type="checkbox" id="showMobile" onchange="updateConfig()">
              移动端
            </label>
            <label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:normal;">
              <input type="checkbox" id="showPc" onchange="updateConfig()">
              PC端
            </label>
          </div>
          <div style="display:flex; align-items:center; gap:24px; margin-top:14px;">
            <label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:normal;">
              <input type="checkbox" id="bookFeatured" onchange="updateConfig()">
              是否推荐
            </label>
            <label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:normal;">
              <input type="checkbox" id="showIndexIcon" onchange="updateConfig()" checked>
              显示首页图标
            </label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>分类（可选，相同分类自动分组）</label>
            <input type="text" id="bookCategory" list="categoryList" placeholder="输入分类名称，如：油画、摄影" oninput="updateConfig()">
            <datalist id="categoryList"></datalist>
          </div>
        </div>

        <div class="form-row">
          <label>背景音乐（可选）</label>
          <div style="display:flex; gap:6px;">
            <input type="text" id="musicUrl" placeholder="粘贴mp3链接或上传" oninput="updateConfig()" style="flex:1; margin:0;">
            <button class="upload-btn" style="margin:0; width:auto; padding:0 10px; flex-shrink:0; height:36px; display:flex; align-items:center; justify-content:center;" onclick="document.getElementById('musicUpload').click()">📁</button>
          </div>
          <input type="file" id="musicUpload" accept="audio/*" style="display:none" onchange="handleMusicUpload(event)">
          <div style="display:flex; gap:16px; margin-top:10px; align-items:center;">
            <label style="font-size:12px; color:#888; margin:0;">音量：<span id="musicVolumeText">0.5</span></label>
            <input type="range" id="musicVolume" min="0" max="1" step="0.1" value="0.5" style="flex:1; margin:0;" oninput="document.getElementById('musicVolumeText').innerText=this.value; updateConfig()">
          </div>
          <div style="display:flex; gap:10px; align-items:center; margin-top:10px;">
            <label style="font-size:12px; color:#888; margin:0;">从第</label>
            <input type="number" id="musicStartPage" value="1" min="1" style="width:60px; margin:0;" onchange="updateConfig()">
            <label style="font-size:12px; color:#888; margin:0;">页开始播放</label>
          </div>
        </div>
      </div>

      <!-- 封面 -->
      <div class="section">
        <div class="section-title">封面</div>
        <div class="page-card" onmousedown="jumpToPage(0)">
          <div class="type-toggle">
            <button id="coverTypeImage" onclick="setCoverType('image')">纯图片</button>
            <button id="coverTypeHtml" onclick="setCoverType('html')">HTML 文字</button>
          </div>
          <div id="coverImageWrap">
            <div class="form-row">
              <label>封面图片</label>
              <div style="display:flex; gap:10px; align-items:center;">
                <div id="coverThumb" style="width:56px; height:56px; border-radius:4px; overflow:hidden; background:#1e1e2c; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  <span style="font-size:10px; color:#666;">空</span>
                </div>
                <div style="flex:1; display:flex; gap:6px; align-items:center;">
                  <input type="text" id="coverImage" placeholder="粘贴链接或上传" oninput="updateConfig(); updateCoverThumb();" style="flex:1; margin:0; height:36px;">
                  <button class="upload-btn" style="margin:0; width:auto; padding:0 10px; flex-shrink:0; height:36px;" onclick="document.getElementById('coverUpload').click()">📁</button>
                </div>
              </div>
              <input type="file" id="coverUpload" accept="image/*" style="display:none" onchange="handleUpload(event, 'coverImage')">
            </div>
          </div>
          <div id="coverHtmlWrap" style="display:none">
            <div class="form-row">
              <label>封面 HTML 内容</label>
              <button id="coverHtmlBtn" style="width:100%; padding:10px; background:#2a2a3c; border:1px solid #444; border-radius:6px; color:#aaa; cursor:pointer; text-align:left; font-size:12px;">
                点击编辑HTML内容
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 内页列表 -->
      <div class="section">
        <div class="section-title">内页（共 <span id="pageCount">0</span> 页）</div>
        <div id="pagesList"></div>
      </div>

      <!-- 封底 -->
      <div class="section">
        <div class="section-title">封底</div>
        <div class="page-card" onmousedown="jumpToPage(Math.floor((config.pages.length + 2) / 2))">
          <div class="type-toggle">
            <button id="backTypeImage" onclick="setBackType('image')">纯图片</button>
            <button id="backTypeHtml" class="active" onclick="setBackType('html')">HTML 文字</button>
          </div>
          <div id="backImageWrap" style="display:none">
            <div class="form-row">
              <label>封底图片</label>
              <div style="display:flex; gap:10px; align-items:center;">
                <div id="backThumb" style="width:56px; height:56px; border-radius:4px; overflow:hidden; background:#1e1e2c; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  <span style="font-size:10px; color:#666;">空</span>
                </div>
                <div style="flex:1; display:flex; gap:6px; align-items:center;">
                  <input type="text" id="backImage" placeholder="粘贴链接或上传" oninput="updateConfig(); updateBackThumb();" style="flex:1; margin:0; height:36px;">
                  <button class="upload-btn" style="margin:0; width:auto; padding:0 10px; flex-shrink:0; height:36px;">📁</button>
                </div>
              </div>
              <input type="file" id="backUpload" accept="image/*" style="display:none" onchange="handleUpload(event, 'backImage')">
            </div>
          </div>
          <div id="backHtmlWrap">
            <div class="form-row">
              <label>封底 HTML 内容</label>
              <button id="backHtmlBtn" style="width:100%; padding:10px; background:#2a2a3c; border:1px solid #444; border-radius:6px; color:#aaa; cursor:pointer; text-align:left; font-size:12px;">
                ${config.backCover.html ? '已编辑，点击修改' : '点击编辑HTML内容'}
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 右侧预览 -->
  <div class="preview-area">
    <div class="preview-badge">实时预览</div>
    <iframe id="previewFrame" src="book-ratio-adaptive.html"></iframe>
  </div>

  </div><!-- /viewEdit -->

  <script>
    // ==========================================
    //  登录验证（Supabase）
    // ==========================================

    async function checkLogin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        document.getElementById('loginView').style.display = 'flex';
        document.getElementById('viewList').style.display = 'none';
        document.getElementById('viewEdit').style.display = 'none';
      } else {
        showListView();
      }
    }

    async function doLogin() {
      const email = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });
        if (error) {
          let msg = error.message;
          if (error.message.includes('Invalid login credentials')) {
            msg = '邮箱或密码错误';
          } else if (error.message.includes('Email not confirmed')) {
            msg = '邮箱还未验证，请先验证邮箱';
          }
          document.getElementById('loginError').textContent = msg;
          document.getElementById('loginError').style.display = 'block';
        } else {
          document.getElementById('loginView').style.display = 'none';
          showListView();
        }
      } catch(e) {
        document.getElementById('loginError').textContent = '登录出错: ' + e.message;
        document.getElementById('loginError').style.display = 'block';
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    // 设置下拉菜单
    function toggleSettingsMenu(e) {
      e.stopPropagation();
      const m = document.getElementById('settingsDropdown');
      m.style.display = m.style.display === 'none' ? 'block' : 'none';
    }
    function closeSettingsMenu() {
      document.getElementById('settingsDropdown').style.display = 'none';
    }
    document.addEventListener('click', () => closeSettingsMenu());

    // 批量导入下拉菜单
    function toggleImportMenu(e) {
      e.stopPropagation();
      const m = document.getElementById('importDropdown');
      m.style.display = m.style.display === 'none' ? 'block' : 'none';
    }
    function closeImportMenu() {
      document.getElementById('importDropdown').style.display = 'none';
    }
    // 点击页面其他地方关闭批量导入下拉
    document.addEventListener('click', () => closeImportMenu());

    // 预览区是 iframe：内部点击事件不会冒泡到父页面，
    // 需单独在 iframe 文档上绑定，点击预览区时也收起两个下拉菜单
    function bindPreviewClose() {
      const frame = document.getElementById('previewFrame');
      if (!frame) return;
      try {
        const doc = frame.contentDocument;
        if (doc) {
          doc.addEventListener('click', () => {
            closeImportMenu();
            closeSettingsMenu();
          });
        }
      } catch(e) {}
    }
    const previewFrameEl = document.getElementById('previewFrame');
    if (previewFrameEl) {
      previewFrameEl.addEventListener('load', bindPreviewClose);
    }
    bindPreviewClose();

    // 批量链接导入
    function openLinksImporter() {
      document.getElementById('linksEditor').value = '';
      document.getElementById('linksModal').style.display = 'flex';
    }
    function closeLinksImporter() {
      document.getElementById('linksModal').style.display = 'none';
    }
    async function applyLinksImporter() {
      const text = document.getElementById('linksEditor').value.trim();
      if (!text) { closeLinksImporter(); return; }
      const urls = text.split('\n').map(s => s.trim()).filter(Boolean);
      if (urls.length === 0) { closeLinksImporter(); return; }

      config.cover.type = 'image';
      config.cover.image = urls[0];
      config.cover.html = '';

      config.backCover.type = 'image';
      config.backCover.image = urls[urls.length - 1];
      config.backCover.html = '';

      if (urls.length > 2) {
        config.pages = urls.slice(1, -1).map(u => ({ type: 'image', src: u, html: '' }));
      } else {
        config.pages = [];
      }

      render();
      await saveConfig();
      closeLinksImporter();
      alert(`已导入 ${urls.length} 个链接（封面1 / 内页${config.pages.length} / 封底1）`);
    }

    // 修改密码
    function openChangePass() {
      document.getElementById('newPass').value = '';
      document.getElementById('confirmPass').value = '';
      document.getElementById('passError').style.display = 'none';
      document.getElementById('changePassModal').style.display = 'flex';
    }
    function closeChangePass() {
      document.getElementById('changePassModal').style.display = 'none';
    }
    async function saveChangePass() {
      const newPass = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmPass').value;
      const errEl = document.getElementById('passError');
      if (!newPass || newPass.length < 6) {
        errEl.textContent = '新密码至少 6 位';
        errEl.style.display = 'block';
        return;
      }
      if (newPass !== confirmPass) {
        errEl.textContent = '两次密码不一致';
        errEl.style.display = 'block';
        return;
      }
      const { error } = await supabase.auth.updateUser({ password: newPass });
      if (error) {
        errEl.textContent = '修改失败：' + error.message;
        errEl.style.display = 'block';
        return;
      }
      alert('密码修改成功，下次登录请用新密码');
      closeChangePass();
    }

    // 页面加载先检查登录
    checkLogin();

    // ==========================================
    //  默认配置
    // ==========================================
    const DEFAULT_CONFIG = {
      background: {
        type: 'color',
        color: '#e8e8e8',
        image: ''
      },
      bookRatio: { w: 420, h: 560 },
      showOn: { mobile: true, pc: true },
      music: { url: '', volume: 0.5, startPage: 1 },
      cover: {
        type: 'image',
        image: '',
        html: ''
      },      pages: [
        { type: 'image', src: '' },
        { type: 'image', src: '' },
        { type: 'image', src: '' }
      ],
      backCover: {
        type: 'image',
        image: '',
        html: ''
      }
    };

    let config = null;
    let currentBookId = null;
    let currentEditingPage = 0; // 当前编辑的页码（0=封面，最后一页=封底）

    // 列表页筛选状态（device 默认空 = 全部显示端）
    const filterState = { category: '', sort: 'latest', device: '', featured: '', keyword: '' };
    // 精选排序下的推荐画册列表（供列表页 ↑↓ 排序）
    let featuredSortedList = [];
    // 当前过滤排序后的列表（用于本地即时排序，乐观更新）
    let currentList = [];

    // ==========================================
    //  多本画册管理
    // ==========================================
    function getBooksIndex() {
      try {
        const idx = localStorage.getItem('booksIndex');
        if (idx) return JSON.parse(idx);
      } catch(e) {}
      return null;
    }

    function saveBooksIndex(idx) {
      localStorage.setItem('booksIndex', JSON.stringify(idx));
    }

    function initBooksIndex() {
      let idx = getBooksIndex();
      if (!idx) {
        // 第一次使用：检查是否有旧的单本配置，迁移过来
        const oldConfig = localStorage.getItem('bookConfig');
        const firstId = 'book_' + Date.now();
        if (oldConfig) {
          localStorage.setItem('bookConfig_' + firstId, oldConfig);
        }
        idx = [{ id: firstId, name: '我的画册 1', updatedAt: new Date().toISOString() }];
        saveBooksIndex(idx);
        localStorage.setItem('currentBookId', firstId);
      }
      return idx;
    }

    function loadBookConfig(bookId) {
      try {
        const saved = localStorage.getItem('bookConfig_' + bookId);
        if (saved) return JSON.parse(saved);
      } catch(e) {}
      return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    }

    async function saveBookConfig(bookId, cfg) {
      await supabase
        .from('books')
        .update({ config: cfg, updated_at: new Date().toISOString() })
        .eq('id', bookId);
    }

    function renderBookSelector() {
      const select = document.getElementById('bookSelect');
      if (!select) return; // 编辑页已无此元素，忽略
      select.innerHTML = '';
      const idx = getBooksIndex();
      idx.forEach(book => {
        const opt = document.createElement('option');
        opt.value = book.id;
        opt.textContent = book.name;
        if (book.id === currentBookId) opt.selected = true;
        select.appendChild(opt);
      });

      // 收集所有已存在的分类，填充到输入提示里
      const categories = new Set();
      idx.forEach(book => {
        const cat = book.config?.category;
        if (cat) categories.add(cat);
      });
      const datalist = document.getElementById('categoryList');
      if (datalist) {
        datalist.innerHTML = '';
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          datalist.appendChild(opt);
        });
      }
    }

    async function switchBook(bookId) {
      currentBookId = bookId;
      const { data, error } = await supabase
        .from('books')
        .select('config')
        .eq('id', bookId)
        .single();
      if (error || !data) {
        alert('加载失败: ' + (error?.message || '找不到画册'));
        return;
      }
      config = data.config;
      render();
      // 刷新预览
      const frame = document.getElementById('previewFrame');
      frame.src = 'book-ratio-adaptive.html?preview=1&book=' + bookId;
    }

    async function newBook() {
      const { data, error } = await supabase
        .from('books')
        .insert({ name: '未命名画册', config: DEFAULT_CONFIG })
        .select()
        .single();
      if (error) {
        alert('创建失败: ' + error.message);
        return;
      }
      currentBookId = data.id;
      config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      render();
      document.getElementById('viewList').style.display = 'none';
      document.getElementById('viewEdit').style.display = 'flex';
      const frame = document.getElementById('previewFrame');
      frame.src = 'book-ratio-adaptive.html?preview=1&book=' + data.id;
    }

    async function deleteBook(bookId) {
      const id = bookId || currentBookId;
      if (!confirm('确定删除？此操作不可恢复')) return;
      const { error } = await supabase.from('books').delete().eq('id', id);
      if (error) {
        alert('删除失败: ' + error.message);
        return;
      }
      showListView();
    }

    async function duplicateBook() {
      const { data: old, error: loadErr } = await supabase
        .from('books')
        .select('name, config')
        .eq('id', currentBookId)
        .single();
      if (loadErr || !old) {
        alert('找不到原画册: ' + (loadErr?.message || ''));
        return;
      }
      const name = prompt('复制为：', old.name + ' 副本');
      if (!name) return;
      const { data: newBook, error } = await supabase
        .from('books')
        .insert({ name, config: old.config })
        .select()
        .single();
      if (error) {
        alert('复制失败: ' + error.message);
        return;
      }
      currentBookId = newBook.id;
      config = JSON.parse(JSON.stringify(old.config));
      render();
      showEditView();
    }

    // ==========================================
    //  配置读写（当前选中的画册）
    // ==========================================
    function loadConfig() {
      return loadBookConfig(currentBookId);
    }

    async function saveConfig() {
      try {
        await saveBookConfig(currentBookId, config);
      } catch(e) {
        console.warn('保存失败: ', e && e.message);
        return; // 保存失败不刷新预览，避免误导
      }
      // 等写入完成后再刷新预览，避免 iframe 读到旧数据导致不同步
      const frame = document.getElementById('previewFrame');
      if (frame) {
        frame.src = `book-ratio-adaptive.html?book=${currentBookId}&page=${currentEditingPage || 0}&t=${Date.now()}`;
      }
    }

    // ==========================================
    //  渲染表单
    // ==========================================
    function render() {
      // 全局
      document.getElementById('bgColor').value = config.background.color;
      document.getElementById('bgImage').value = config.background.image;
      document.getElementById('ratioW').value = config.bookRatio.w;
      document.getElementById('ratioH').value = config.bookRatio.h;
      document.getElementById('showMobile').checked = config.showOn?.mobile !== false;
      document.getElementById('showPc').checked = config.showOn?.pc !== false;
      document.getElementById('bookFeatured').checked = !!config.featured;
      document.getElementById('showIndexIcon').checked = config.showIndexIcon !== false;
      document.getElementById('bookCategory').value = config.category || '';
      document.getElementById('musicUrl').value = config.music?.url || '';
      document.getElementById('musicVolume').value = config.music?.volume || 0.5;
      document.getElementById('musicVolumeText').innerText = config.music?.volume || 0.5;
      document.getElementById('musicStartPage').value = config.music?.startPage || 1;

      // 封面
      document.getElementById('coverImage').value = config.cover.image;
      setCoverType(config.cover.type || 'image', false);

      // 内页
      renderPages();

      // 封底
      setBackType(config.backCover.type, false);
      document.getElementById('backImage').value = config.backCover.image;

      // 更新缩略图
      updateBgThumb();
      updateCoverThumb();
      updateBackThumb();

      // 绑定封面 HTML 按钮
      const coverBtn = document.getElementById('coverHtmlBtn');
      if (coverBtn) {
        coverBtn.onclick = () => openCoverHtmlEditor();
        coverBtn.textContent = config.cover.html ? '已编辑，点击修改' : '点击编辑HTML内容';
      }
      // 绑定封底 HTML 按钮
      const backBtn = document.getElementById('backHtmlBtn');
      if (backBtn) {
        backBtn.onclick = () => openBackHtmlEditor();
        backBtn.textContent = config.backCover.html ? '已编辑，点击修改' : '点击编辑HTML内容';
      }
    }

    function renderPages() {
      const list = document.getElementById('pagesList');
      list.innerHTML = '';
      config.pages.forEach((page, idx) => {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.onmousedown = () => { jumpToPage(Math.floor((idx + 2) / 2)); };
        card.innerHTML = `
          <div class="page-card-header">
            <div class="page-card-title">第 ${idx + 1} 页</div>
            <div class="page-card-actions">
              <button onclick="movePage(${idx}, -1)" title="上移">↑</button>
              <button onclick="movePage(${idx}, 1)" title="下移">↓</button>
              <button class="delete" onclick="removePage(${idx})" title="删除">✕</button>
            </div>
          </div>
          <div class="type-toggle">
            <button class="${page.type === 'image' ? 'active' : ''}" onclick="setPageType(${idx}, 'image')">纯图片</button>
            <button class="${page.type === 'html' ? 'active' : ''}" onclick="setPageType(${idx}, 'html')">HTML 内容</button>
          </div>
          <div id="page-${idx}-imageWrap" style="${page.type === 'image' ? '' : 'display:none'}">
            <div class="form-row">
              <label>图片</label>
              <div style="display:flex; gap:10px; align-items:flex-start;">
                <div id="page-${idx}-thumb" style="width:60px; height:60px; border-radius:4px; overflow:hidden; background:#2a2a3c; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  ${page.src ? `<img src="${page.src}" style="width:100%; height:100%; object-fit:cover;">` : '<span style="font-size:10px; color:#666;">空</span>'}
                </div>
                <div style="flex:1; display:flex; gap:6px;">
                  <input type="text" value="${page.src || ''}" placeholder="粘贴链接或上传" oninput="setPageSrc(${idx}, this.value); updateThumb(${idx});" style="flex:1; margin:0;">
                  <button class="upload-btn" style="margin:0; width:auto; padding:0 10px; flex-shrink:0; height:36px; display:flex; align-items:center; justify-content:center;" onclick="document.getElementById('pageUpload-${idx}').click()">📁</button>
                </div>
              </div>
              <input type="file" id="pageUpload-${idx}" accept="image/*" style="display:none" onchange="handleUpload(event, null, ${idx})">
            </div>
          </div>
          <div id="page-${idx}-htmlWrap" style="${page.type === 'html' ? '' : 'display:none'}">
            <div class="form-row">
              <label>HTML 内容</label>
              <button id="page-${idx}-htmlBtn" style="width:100%; padding:10px; background:#2a2a3c; border:1px solid #444; border-radius:6px; color:#aaa; cursor:pointer; text-align:left; font-size:12px;">
                ${page.html ? '已编辑，点击修改' : '点击编辑HTML内容'}
              </button>
            </div>
          </div>
        `;
        list.appendChild(card);
        // 绑定 HTML 编辑按钮
        const htmlBtn = document.getElementById(`page-${idx}-htmlBtn`);
        if (htmlBtn) {
          htmlBtn.onclick = () => openHtmlEditor(idx);
        }
        // 卡片下面的插入按钮
        const addBtn = document.createElement('button');
        addBtn.textContent = '+';
        addBtn.style.cssText = 'display:block; margin:8px auto; width:22px; height:22px; line-height:20px; padding:0; border:none; border-radius:50%; background:#333; color:#888; font-size:14px; cursor:pointer; text-align:center;';
        addBtn.onmouseover = () => { addBtn.style.background = '#6c5ce7'; addBtn.style.color = '#fff'; };
        addBtn.onmouseout = () => { addBtn.style.background = '#333'; addBtn.style.color = '#888'; };
        addBtn.onclick = () => insertPageAfter(idx);
        list.appendChild(addBtn);
      });
      document.getElementById('pageCount').textContent = config.pages.length;
    }

    // ==========================================
    //  操作
    // ==========================================
    function setCoverType(type, save = true) {
      config.cover.type = type;
      document.getElementById('coverTypeHtml').classList.toggle('active', type === 'html');
      document.getElementById('coverTypeImage').classList.toggle('active', type === 'image');
      document.getElementById('coverHtmlWrap').style.display = type === 'html' ? '' : 'none';
      document.getElementById('coverImageWrap').style.display = type === 'image' ? '' : 'none';
      if (save) updateConfig();
    }

    function setBackType(type, save = true) {
      config.backCover.type = type;
      document.getElementById('backTypeHtml').classList.toggle('active', type === 'html');
      document.getElementById('backTypeImage').classList.toggle('active', type === 'image');
      document.getElementById('backHtmlWrap').style.display = type === 'html' ? '' : 'none';
      document.getElementById('backImageWrap').style.display = type === 'image' ? '' : 'none';
      if (save) updateConfig();
    }

    function addPage() {
      config.pages.push({ type: 'image', src: '' });
      renderPages();
      updateConfig();
    }

    // 在指定位置后面插入新页
    function insertPageAfter(idx) {
      config.pages.splice(idx + 1, 0, { type: 'image', src: '' });
      renderPages();
      updateConfig();
    }

    // HTML 弹窗编辑
    let editingType = ''; // 'cover' | 'page' | 'back'
    let editingPageIdx = null;
    function openHtmlEditor(idx) {
      editingType = 'page';
      editingPageIdx = idx;
      document.getElementById('htmlEditor').value = config.pages[idx].html || '';
      document.getElementById('htmlModal').style.display = 'flex';
      refreshHtmlTplList();
    }
    function openCoverHtmlEditor() {
      editingType = 'cover';
      document.getElementById('htmlEditor').value = config.cover.html || '';
      document.getElementById('htmlModal').style.display = 'flex';
      refreshHtmlTplList();
    }
    function openBackHtmlEditor() {
      editingType = 'back';
      document.getElementById('htmlEditor').value = config.backCover.html || '';
      document.getElementById('htmlModal').style.display = 'flex';
      refreshHtmlTplList();
    }
    function closeHtmlEditor() {
      document.getElementById('htmlModal').style.display = 'none';
      editingType = '';
      editingPageIdx = null;
    }
    function saveHtmlEditor() {
      const val = document.getElementById('htmlEditor').value;
      if (editingType === 'page') {
        config.pages[editingPageIdx].html = val;
        const btn = document.getElementById(`page-${editingPageIdx}-htmlBtn`);
        if (btn) btn.textContent = val ? '已编辑，点击修改' : '点击编辑HTML内容';

      } else if (editingType === 'back') {
        config.backCover.html = val;
        const btn = document.getElementById('backHtmlBtn');
        if (btn) btn.textContent = val ? '已编辑，点击修改' : '点击编辑HTML内容';
      }

    // ==========================================
    //  素材库：HTML 模板 + 图片库
    // ==========================================
    let tplList = [];
    let tplCategory = 'cover';
    let assetsTab = 'tpl';
    let editingTplId = null;
    const MATERIAL_BUCKET = 'materials';

    async function loadTemplates() {
      const { data, error } = await supabase
        .from('book_templates')
        .select('id, name, category, html')
        .order('created_at', { ascending: true });
      if (error) { console.log('模板加载失败', error.message); return; }
      tplList = data || [];
      renderTplList();
    }

    function openAssets() {
      document.getElementById('assetsModal').style.display = 'flex';
      switchAssetsTab(assetsTab || 'tpl');
      switchTplCat(tplCategory);
    }
    function closeAssets() {
      document.getElementById('assetsModal').style.display = 'none';
    }

    function switchAssetsTab(tab) {
      assetsTab = tab;
      const tplBtn = document.getElementById('assetsTabTpl');
      const imgBtn = document.getElementById('assetsTabImg');
      if (tab === 'tpl') {
        tplBtn.style.background = '#6c5ce7'; tplBtn.style.color = '#fff';
        imgBtn.style.background = '#333'; imgBtn.style.color = '#aaa';
        document.getElementById('assetsTplPanel').style.display = '';
        document.getElementById('assetsImgPanel').style.display = 'none';
      } else {
        imgBtn.style.background = '#6c5ce7'; imgBtn.style.color = '#fff';
        tplBtn.style.background = '#333'; tplBtn.style.color = '#aaa';
        document.getElementById('assetsTplPanel').style.display = 'none';
        document.getElementById('assetsImgPanel').style.display = '';
        loadMaterials();
      }
    }

    function switchTplCat(cat) {
      tplCategory = cat;
      const map = { cover: 'tplCatCover', page: 'tplCatPage', back: 'tplCatBack' };
      Object.keys(map).forEach(c => {
        const btn = document.getElementById(map[c]);
        if (!btn) return;
        btn.style.background = c === cat ? '#6c5ce7' : '#2a2a3c';
        btn.style.color = c === cat ? '#fff' : '#ccc';
      });
      renderTplList();
    }

    function renderTplList() {
      const box = document.getElementById('tplList');
      if (!box) return;
      const list = tplList.filter(t => t.category === tplCategory);
      if (!list.length) {
        box.innerHTML = '<div style="color:#666; font-size:13px; padding:24px; text-align:center;">该分类还没有模板，点击「+ 新增模板」创建</div>';
        return;
      }
      box.innerHTML = list.map(t => `
        <div style="display:flex; align-items:center; gap:10px; background:#22223a; border-radius:8px; padding:10px 14px;">
          <div style="flex:1; font-size:13px; color:#ddd; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${t.name}</div>
          <button onclick="openTplEditor('${t.id}')" style="padding:5px 12px; background:#333; border:none; border-radius:6px; color:#aaa; cursor:pointer; font-size:12px;">编辑</button>
          <button onclick="deleteTpl('${t.id}')" style="padding:5px 12px; background:#333; border:none; border-radius:6px; color:#e74c3c; cursor:pointer; font-size:12px;">删除</button>
        </div>`).join('');
    }

    function openTplEditor(id) {
      editingTplId = id || null;
      const tpl = id ? tplList.find(t => t.id === id) : null;
      document.getElementById('tplEditorTitle').textContent = tpl ? '编辑模板' : '新增模板';
      document.getElementById('tplName').value = tpl ? tpl.name : '';
      document.getElementById('tplHtml').value = tpl ? tpl.html : '';
      document.getElementById('tplEditorModal').style.display = 'flex';
    }
    function closeTplEditor() {
      document.getElementById('tplEditorModal').style.display = 'none';
      editingTplId = null;
    }
    async function saveTpl() {
      const name = document.getElementById('tplName').value.trim();
      const html = document.getElementById('tplHtml').value;
      if (!name) { alert('请填写模板名称'); return; }
      const row = { name, category: tplCategory, html };
      if (editingTplId) {
        const { error } = await supabase.from('book_templates').update(row).eq('id', editingTplId);
        if (error) { alert('保存失败：' + error.message); return; }
      } else {
        const { error } = await supabase.from('book_templates').insert(row);
        if (error) { alert('保存失败：' + error.message); return; }
      }
      closeTplEditor();
      loadTemplates();
    }
    async function deleteTpl(id) {
      if (!confirm('确定删除该模板？')) return;
      const { error } = await supabase.from('book_templates').delete().eq('id', id);
      if (error) { alert('删除失败：' + error.message); return; }
      loadTemplates();
    }

    // 套用模板（封面/内页/封底编辑弹窗里）
    function refreshHtmlTplList() {
      const box = document.getElementById('htmlTplList');
      if (!box) return;
      const cat = editingType === 'cover' ? 'cover' : editingType === 'back' ? 'back' : 'page';
      const list = tplList.filter(t => t.category === cat);
      if (!list.length) {
        box.innerHTML = '<span style="font-size:12px; color:#666;">暂无模板，可到「素材库」新增</span>';
        return;
      }
      box.innerHTML = list.map(t => `
        <button onclick="applyTpl('${t.id}')" style="padding:5px 12px; background:#2a2a3c; border:1px solid #444; border-radius:16px; color:#ccc; cursor:pointer; font-size:12px;">${t.name}</button>`).join('');
    }
    function applyTpl(id) {
      const tpl = tplList.find(t => t.id === id);
      if (!tpl) return;
      document.getElementById('htmlEditor').value = tpl.html;
    }

    // 图片库
    async function loadMaterials() {
      const box = document.getElementById('materialList');
      if (!box) return;
      box.innerHTML = '<div style="color:#666; font-size:13px; padding:24px; text-align:center;">加载中…</div>';
      const { data, error } = await supabase.storage.from(MATERIAL_BUCKET).list('');
      if (error || !data) {
        box.innerHTML = '<div style="color:#e74c3c; font-size:13px; padding:24px; text-align:center;">图片加载失败：' + (error && error.message || '未知错误') + '。请确认已执行建表 SQL（素材库图片桶）</div>';
        return;
      }
      const imgs = data.filter(f => f.metadata && /^image\//.test(f.metadata.mimetype || ''));
      if (!imgs.length) {
        box.innerHTML = '<div style="color:#666; font-size:13px; padding:24px; text-align:center;">还没有素材图片，点击「+ 上传图片」添加</div>';
        return;
      }
      box.innerHTML = imgs.map(f => {
        const url = supabase.storage.from(MATERIAL_BUCKET).getPublicUrl(f.name).data.publicUrl;
        return `
          <div style="background:#22223a; border-radius:8px; overflow:hidden;">
            <img src="${url}" style="width:100%; height:90px; object-fit:cover; display:block; background:#111;" onerror="this.style.display='none'">
            <div style="padding:8px; display:flex; flex-direction:column; gap:6px;">
              <div style="font-size:11px; color:#aaa; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${f.name}</div>
              <div style="display:flex; gap:6px;">
                <button onclick="copyMaterialLink('${f.name}')" style="flex:1; padding:5px 0; background:#6c5ce7; border:none; border-radius:6px; color:#fff; cursor:pointer; font-size:11px;">复制链接</button>
                <button onclick="deleteMaterial('${f.name}')" style="padding:5px 8px; background:#333; border:none; border-radius:6px; color:#e74c3c; cursor:pointer; font-size:11px;">删除</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }
    async function uploadMaterials(e) {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      let ok = 0, fail = 0;
      for (const file of files) {
        const path = Date.now() + '_' + file.name.replace(/[^\w.\-一-龥]/g, '_');
        const { error } = await supabase.storage.from(MATERIAL_BUCKET).upload(path, file, { cacheControl: '3600', upsert: true });
        if (error) fail++; else ok++;
      }
      loadMaterials();
      e.target.value = '';
      alert('上传完成：成功 ' + ok + ' 张' + (fail ? '，失败 ' + fail + ' 张' : ''));
    }
    async function copyMaterialLink(name) {
      const url = supabase.storage.from(MATERIAL_BUCKET).getPublicUrl(name).data.publicUrl;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url);
        } else {
          const ta = document.createElement('textarea');
          ta.value = url; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
        }
        alert('链接已复制');
      } catch(e2) {
        alert('复制失败，请手动复制：' + url);
      }
    }
    async function deleteMaterial(name) {
      if (!confirm('确定删除该图片？模板中引用它的链接将失效。')) return;
      const { error } = await supabase.storage.from(MATERIAL_BUCKET).remove([name]);
      if (error) { alert('删除失败：' + error.message); return; }
      loadMaterials();
    }

    function removePage(idx) {
      config.pages.splice(idx, 1);
      renderPages();
      updateConfig();
    }

    function movePage(idx, dir) {
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= config.pages.length) return;
      [config.pages[idx], config.pages[newIdx]] = [config.pages[newIdx], config.pages[idx]];
      renderPages();
      updateConfig();
    }

    function setPageType(idx, type) {
      config.pages[idx].type = type;
      renderPages();
      updateConfig();
    }

    function setPageSrc(idx, src) {
      config.pages[idx].src = src;
      updateConfig();
    }

    function setPageHtml(idx, html) {
      config.pages[idx].html = html;
      updateConfig();
    }

    // ==========================================
    //  汇总更新
    // ==========================================
    let updateTimer;
    function updateConfig() {
      // 从表单读回值
      config.background.color = document.getElementById('bgColor').value;
      config.background.image = document.getElementById('bgImage').value.trim();
      config.bookRatio.w = parseInt(document.getElementById('ratioW').value) || 420;
      config.bookRatio.h = parseInt(document.getElementById('ratioH').value) || 560;
      config.showOn = {
        mobile: document.getElementById('showMobile').checked,
        pc: document.getElementById('showPc').checked
      };
      config.featured = document.getElementById('bookFeatured').checked;
      config.showIndexIcon = document.getElementById('showIndexIcon').checked;
      config.category = document.getElementById('bookCategory').value.trim();
      config.music = {
        url: document.getElementById('musicUrl').value.trim(),
        volume: parseFloat(document.getElementById('musicVolume').value),
        startPage: parseInt(document.getElementById('musicStartPage').value) || 1
      };
      config.cover.image = document.getElementById('coverImage').value;
      config.backCover.image = document.getElementById('backImage').value;

      clearTimeout(updateTimer);
      updateTimer = setTimeout(() => {
        saveConfig();
      }, 300);
    }

    // ==========================================
    //  图片上传：本地选图 → 压缩 → base64
    // ==========================================
    async function handleUpload(event, inputId, pageIdx) {
      const file = event.target.files[0];
      if (!file) return;

      // 检查文件大小（原图不超过 10MB）
      if (file.size > 10 * 1024 * 1024) {
        alert('图片太大了，请选 10MB 以内的图片');
        event.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        const img = new Image();
        img.onload = async () => {
          // 压缩：最大宽度 800px，保持比例
          const maxW = 800;
          let w = img.width, h = img.height;
          if (w > maxW) {
            h = h * maxW / w;
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          // 转 JPEG Blob
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));

          // 上传到 Supabase Storage
          const fileName = `${currentBookId}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
          const { data, error } = await supabase.storage
            .from('book-images')
            .upload(fileName, blob, { contentType: 'image/jpeg' });

          if (error) {
            alert('上传失败：' + error.message);
            return;
          }

          // 拿到公开 URL
          const { data: { publicUrl } } = supabase.storage
            .from('book-images')
            .getPublicUrl(fileName);

          // 填入对应位置
          if (inputId === 'coverImage') {
            document.getElementById(inputId).value = publicUrl;
            updateCoverThumb();
          } else if (inputId === 'backImage') {
            document.getElementById(inputId).value = publicUrl;
            updateBackThumb();
          } else if (pageIdx !== null && pageIdx !== undefined) {
            // 内页：更新 config 并重新渲染
            config.pages[pageIdx].src = publicUrl;
            // 更新输入框的值（不整个重渲染，避免上传时页面跳动）
            const wrap = document.getElementById(`page-${pageIdx}-imageWrap`);
            if (wrap) {
              const input = wrap.querySelector('input[type="text"]');
              if (input) input.value = publicUrl;
            }
            updateThumb(pageIdx);
          }
          updateConfig();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);

      // 清空 input，允许重复选同一个文件
      event.target.value = '';
    }

    async function handleMusicUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        alert('音乐文件太大了，请选 10MB 以内的');
        event.target.value = '';
        return;
      }

      // 上传到 Supabase Storage
      const fileName = `${currentBookId}/music_${Date.now()}.mp3`;
      const { data, error } = await supabase.storage
        .from('book-images')
        .upload(fileName, file, { contentType: 'audio/mpeg' });

      if (error) {
        alert('上传失败：' + error.message);
        return;
      }

      // 拿到公开 URL
      const { data: { publicUrl } } = supabase.storage
        .from('book-images')
        .getPublicUrl(fileName);

      document.getElementById('musicUrl').value = publicUrl;
      updateConfig();
      event.target.value = '';
    }

    // ==========================================
    //  背景图片上传
    // ==========================================
    async function handleBgUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        alert('图片太大了，请选 10MB 以内的图片');
        event.target.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          // 背景图最大宽度 1920
          const maxW = 1920;
          let w = img.width, h = img.height;
          if (w > maxW) {
            h = h * maxW / w;
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

          const fileName = `${currentBookId}/bg_${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
          const { data, error } = await supabase.storage
            .from('book-images')
            .upload(fileName, blob, { contentType: 'image/jpeg' });
          if (error) {
            alert('背景图上传失败：' + error.message);
            return;
          }
          const { data: { publicUrl } } = supabase.storage
            .from('book-images')
            .getPublicUrl(fileName);
          document.getElementById('bgImage').value = publicUrl;
          updateBgThumb();
          updateConfig();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    // 点击卡片直接跳转预览页（通过 URL 参数，最可靠）
    function jumpToPage(page) {
      currentEditingPage = page;
      const frame = document.getElementById('previewFrame');
      frame.src = `book-ratio-adaptive.html?book=${currentBookId}&page=${page}&t=${Date.now()}`;
    }

    // 更新内页缩略图

      if (!thumb) return;

        ? `<img src="${src}" style="width:100%; height:100%; object-fit:cover;">`
        : '<span style="font-size:10px; color:#666;">空</span>';

    // 更新背景缩略图
    function updateBgThumb() {
      const thumb = document.getElementById('bgThumb');
      if (!thumb) return;
      const src = config.background.image;
      thumb.innerHTML = src
        ? `<img src="${src}" style="width:100%; height:100%; object-fit:cover;">`
        : '<span style="font-size:10px; color:#666;">空</span>';

    // 更新封面/封底缩略图
    function updateCoverThumb() {
      const thumb = document.getElementById('coverThumb');
      if (!thumb) return;
