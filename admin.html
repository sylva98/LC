<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画册后台管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://izspqexefmggllhldfty.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kGwGiZSKXZkIDtvnGcDCSA_9Gnin7sk';
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 简单的错误日志包装
    const debug = (...args) => console.log('[admin]', ...args);

    // 拉取所有画册（按创建时间降序）
    async function fetchBooks() {
      debug('fetchBooks start');
      const { data, error } = await supabase
        .from('books')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) {
        console.error('fetchBooks error', error);
        showEmptyState('从服务器拉取画册失败：' + (error.message || error));
        return [];
      }
      debug('fetchBooks result', data);
      return data || [];
    }

    // 渲染列表
    async function renderList() {
      const container = document.getElementById('booksGrid');
      container.innerHTML = '<div class="loading">加载中…</div>';
      const books = await fetchBooks();
      if (!books || books.length === 0) {
        container.innerHTML = '<div class="empty">暂无画册，点击“新建画册”开始。</div>';
        return;
      }
      container.innerHTML = '';
      books.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.dataset.id = book.id;

        const cover = document.createElement('div');
        cover.className = 'book-cover';
        if (book.cover_url) {
          const img = document.createElement('img');
          img.src = book.cover_url;
          img.alt = book.name || '封面';
          cover.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'book-cover-placeholder';
          ph.innerText = '无封面';
          cover.appendChild(ph);
        }

        const info = document.createElement('div');
        info.className = 'book-info';
        info.innerHTML = `<div class="book-name">${escapeHtml(book.name || '未命名')}</div>
                          <div class="book-meta">ID: ${book.id} · ${book.created_at ? new Date(book.created_at).toLocaleString() : ''}</div>`;

        const actions = document.createElement('div');
        actions.className = 'book-actions';
        const editBtn = document.createElement('button');
        editBtn.innerText = '编辑';
        editBtn.onclick = (e) => { e.stopPropagation(); openEdit(book.id); };
        const delBtn = document.createElement('button');
        delBtn.innerText = '删除';
        delBtn.className = 'danger';
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          if (!confirm('确认删除该画册吗？')) return;
          await deleteBook(book.id);
        };
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        card.appendChild(cover);
        card.appendChild(info);
        card.appendChild(actions);

        card.onclick = () => openEdit(book.id);
        container.appendChild(card);
      });
    }

    function showEmptyState(msg) {
      const container = document.getElementById('booksGrid');
      container.innerHTML = `<div class="empty">${escapeHtml(msg)}</div>`;
    }

    // 打开编辑视图
    async function openEdit(id) {
      const res = await supabase.from('books').select('*').eq('id', id).single();
      if (res.error) {
        console.error('openEdit error', res.error);
        alert('获取画册失败：' + (res.error.message || res.error));
        return;
      }
      const book = res.data;
      document.getElementById('editId').value = book.id;
      document.getElementById('editName').value = book.name || '';
      document.getElementById('editDesc').value = book.description || '';
      showEditView();
    }

    // 删除
    async function deleteBook(id) {
      const { error } = await supabase.from('books').delete().eq('id', id);
      if (error) {
        console.error('deleteBook error', error);
        alert('删除失败：' + (error.message || error));
        return;
      }
      await renderList();
      showListView();
    }

    // 新建画册（并回到列表并刷新）
    async function createNewBook() {
      const now = new Date().toISOString();
      const defaultName = '新建画册';
      const { data, error } = await supabase.from('books').insert([{ name: defaultName, description: '', created_at: now, updated_at: now }]).select().single();
      if (error) {
        console.error('createNewBook error', error);
        alert('创建失败：' + (error.message || error));
        return;
      }
      // 创建成功后直接刷新列表并进入编辑（按你之前的偏好，这里先回列表并高亮新建项）
      await renderList();
      showListView();
      // 可选：跳到新建项并打开编辑
      // openEdit(data.id);
    }

    // 保存编辑
    async function saveEdit(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const name = document.getElementById('editName').value.trim();
      const desc = document.getElementById('editDesc').value.trim();
      const updated_at = new Date().toISOString();
      const { error } = await supabase.from('books').update({ name, description: desc, updated_at }).eq('id', id);
      if (error) {
        console.error('saveEdit error', error);
        alert('保存失败：' + (error.message || error));
        return;
      }
      await renderList();
      showListView();
    }

    // helper: 删除可能的 XSS 字符
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; });
    }

    function showListView() {
      document.getElementById('viewList').style.display = 'block';
      document.getElementById('viewEdit').style.display = 'none';
    }

    function showEditView() {
      document.getElementById('viewList').style.display = 'none';
      document.getElementById('viewEdit').style.display = 'flex';
    }

    // 页面载入
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('btnNew').addEventListener('click', createNewBook);
      document.getElementById('btnBack').addEventListener('click', () => { renderList(); showListView(); });
      document.getElementById('editForm').addEventListener('submit', saveEdit);
      // 初次渲染
      await renderList();
      showListView();
    });
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; color: #333; }
    .container { padding: 28px; }
    .list-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .btn { padding:10px 14px; border-radius:8px; border: none; cursor:pointer; }
    .btn-primary { background:#e63946; color:#fff; }
    .books-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:20px; }
    .book-card { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.06); cursor:pointer; }
    .book-cover { width:100%; aspect-ratio:3/4; background:#eee; display:flex; align-items:center; justify-content:center; }
    .book-cover img { width:100%; height:100%; object-fit:cover; }
    .book-info { padding:12px; }
    .book-actions { display:flex; gap:8px; padding:12px; }
    .book-actions button { flex:1; padding:8px; border-radius:6px; border:1px solid #ddd; background:#fff; }
    .book-actions button.danger { border-color:#e63946; color:#e63946; }
    .view-edit { display:none; height:calc(100vh - 56px); }
    .edit-panel { width:380px; background:#1e1e2e; color:#ddd; padding:16px; }
    .edit-main { flex:1; padding:16px; }
    .row { margin-bottom:12px; }
    input, textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; }
    .loading, .empty { padding:20px; color:#666; }
  </style>
</head>
<body>
  <div class="container">
    <div id="viewList" class="view-list">
      <div class="list-header">
        <h1>我的画册</h1>
        <div>
          <button id="btnNew" class="btn btn-primary">+ 新建画册</button>
        </div>
      </div>
      <div id="booksGrid" class="books-grid"></div>
    </div>

    <div id="viewEdit" class="view-edit" style="display:none;">
      <div class="edit-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <div style="font-weight:700">编辑画册</div>
          <button id="btnBack" class="btn">← 返回</button>
        </div>
        <form id="editForm">
          <input type="hidden" id="editId" />
          <div class="row">
            <label>名称</label>
            <input id="editName" required />
          </div>
          <div class="row">
            <label>描述</label>
            <textarea id="editDesc" rows="6"></textarea>
          </div>
          <div style="display:flex; gap:8px;">
            <button type="submit" class="btn btn-primary">保存</button>
            <button type="button" class="btn" onclick="showListView()">取消</button>
          </div>
        </form>
      </div>
      <div class="edit-main">
        <iframe id="previewFrame" style="width:100%; height:100%; border:0; background:#fff;" src="about:blank"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
