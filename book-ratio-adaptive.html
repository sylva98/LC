<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LC</title>
  <link href="page-flip.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      background: #e8e8e8;
      font-family: "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      height: 100%;
    }

    .page-wrapper {
      padding: 20px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #book {
      background: transparent;
      border-radius: 2px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      margin: 0 auto;
    }

    .page { background: #fff; overflow: hidden; position: relative; }
    .page.--left::after,
    .page.--right::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30px;
      pointer-events: none;
      z-index: 10;
    }
    .page.--left::after {
      right: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.15), transparent);
    }
    .page.--right::after {
      left: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.15), transparent);
    }

    .page-image-only img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .page-html-content { width: 100%; height: 100%; overflow-y: auto; }

    .controls { margin-top: 20px; display: flex; gap: 16px; align-items: center; }
    .controls button {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid #999; background: rgba(255,255,255,0.9);
      color: #666; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .controls button:active { background: #333; color: #fff; transform: scale(0.95); }
    .page-num { font-size: 12px; color: #999; letter-spacing: 2px; min-width: 50px; text-align: center; }
    .tip { margin-top: 15px; font-size: 11px; color: #aaa; text-align: center; }
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; letter-spacing: 1px;
      opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 1000;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="loading" style="position:fixed; top:0; left:0; right:0; bottom:0; background:#e8e8e8; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; gap:16px;">
    <div style="width:32px; height:32px; border:2px solid #ddd; border-top-color:#999; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <div style="font-size:13px; color:#999; letter-spacing:2px;">加载中</div>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <div class="page-wrapper">
    <div id="book"></div>
    <div class="controls">
      <button id="homeBtn" onclick="window.location.href='index.html'" title="返回首页">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button onclick="prevPage()">‹</button>
      <div class="page-num" id="pageNum"></div>
      <button onclick="nextPage()">›</button>
      <button id="shareBtn" onclick="shareBook()" title="分享画册">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://izspqexefmggllhldfty.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kGwGiZSKXZkIDtvnGcDCSA_9Gnin7sk';
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
  <audio id="bgMusic" loop preload="auto" style="display:none;"></audio>
  <script src="page-flip.browser.min.js"></script>
  <script>
    // ==========================================
    //  配置：从 Supabase 读取
    // ==========================================
    const DEFAULT_CONFIG = {
      background: { type: 'color', color: '#e8e8e8', image: '' },
      bookRatio: { w: 420, h: 560 },
      cover: { type: 'image', image: '', html: '' },
      pages: [
        { type: 'image', src: '' },
        { type: 'image', src: '' },
        { type: 'image', src: '' }
      ],
      backCover: { type: 'image', image: '', html: '' }
    };

    async function loadConfig() {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('book');
      const shortCode = params.get('s');
      currentBookId = bookId || null;
      try {
        // 短链接：/s/<8位短码>，按 config.shareCode 查
        if (shortCode) {
          const { data, error } = await supabase
            .from('books')
            .select('id, name, config')
            .eq('config->>shareCode', shortCode)
            .maybeSingle();
          if (!error && data && data.config) {
            currentBookId = data.id;
            document.title = data.name || '画册';
            return data.config;
          }
          // 兼容旧版短链接 /s/<UUID>：短码查不到且形如 UUID 时，按完整 id 查
          if (shortCode.indexOf('-') > 0) {
            const { data: d2, error: e2 } = await supabase
              .from('books')
              .select('id, name, config')
              .eq('id', shortCode)
              .maybeSingle();
            if (!e2 && d2 && d2.config) {
              currentBookId = d2.id;
              document.title = d2.name || '画册';
              return d2.config;
            }
          }
        }
        // 常规链接：?book=<UUID>
        if (bookId) {
          const { data, error } = await supabase
            .from('books')
            .select('name, config')
            .eq('id', bookId)
            .single();
          if (data && data.config) {
            document.title = data.name || '画册';
            return data.config;
          }
        }
      } catch(e) {}
      return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    }

    function buildPagesFromConfig(cfg) {
      const pages = [];
      pages.push({
        type: cfg.cover.type,
        src: cfg.cover.image,
        html: cfg.cover.html,
        hard: true
      });
      cfg.pages.forEach(p => {
        pages.push({
          type: p.type,
          src: p.src,
          html: p.html
        });
      });
      pages.push({
        type: cfg.backCover.type,
        src: cfg.backCover.image,
        html: cfg.backCover.html,
        hard: true
      });
      return pages;
    }

    let CONFIG, BOOK_RATIO_W, BOOK_RATIO_H, PAGES, currentBookId = null;

    function applyBackground() {
      if (CONFIG.background.type === 'color') {
        document.body.style.background = CONFIG.background.color;
      } else if (CONFIG.background.type === 'image' && CONFIG.background.image) {
        document.body.style.background = `url(${CONFIG.background.image}) center/cover no-repeat`;
      }
    }

    async function init() {
      try {
        CONFIG = await loadConfig();

        // 判断当前设备是否允许访问
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const showOn = CONFIG.showOn || { mobile: true, pc: true };
        const allowed = isMobile ? showOn.mobile !== false : showOn.pc !== false;

        if (!allowed) {
          document.getElementById('loading').innerHTML = '<div style="color:#999; font-size:14px;">当前设备无法查看此画册</div>';
          return;
        }

        BOOK_RATIO_W = CONFIG.bookRatio.w;
        BOOK_RATIO_H = CONFIG.bookRatio.h;
        PAGES = buildPagesFromConfig(CONFIG);

        applyBackground();
        // 首页图标按钮：config.showIndexIcon 为 false 时隐藏（默认显示）
        const homeBtn = document.getElementById('homeBtn');
        if (homeBtn) homeBtn.style.display = (CONFIG.showIndexIcon === false) ? 'none' : '';
        initBook();

        // 初始化背景音乐
        const music = CONFIG.music || {};
        window.musicConfig = music;
        window.bgMusic = document.getElementById('bgMusic');
        if (music.url) {
          window.bgMusic.src = music.url;
          window.bgMusic.volume = music.volume || 0.5;
        }
        window.musicStarted = false;
      } finally {
        document.getElementById('loading').style.display = 'none';
      }

      // 从 URL 参数读要跳转的页码
      const params = new URLSearchParams(window.location.search);
      const goTo = parseInt(params.get('page'));
      if (!isNaN(goTo) && pageFlip) {
        setTimeout(() => {
          let cur = pageFlip.getCurrentPageIndex();
          while (cur > 0) {
            pageFlip.flipPrev('top');
            cur--;
          }
          for (let i = 0; i < goTo; i++) {
            pageFlip.flipNext('top');
          }
          updateNum();
        }, 300);
      }
    }

    init();

    function buildPages() {
      let bookEl = document.getElementById('book');
      if (!bookEl) {
        bookEl = document.createElement('div');
        bookEl.id = 'book';
        const controls = document.querySelector('.controls');
        document.querySelector('.page-wrapper').insertBefore(bookEl, controls);
      }
      bookEl.innerHTML = '';
      PAGES.forEach(p => {
        const div = document.createElement('div');
        div.className = 'page';
        if (p.hard) div.setAttribute('data-density', 'hard');
        if (p.type === 'image') {
          div.className += ' page-image-only';
          div.innerHTML = `<img src="${p.src}" alt="" loading="lazy">`;
        } else {
          div.className += ' page-html-content';
          div.innerHTML = p.html;
        }
        bookEl.appendChild(div);
      });
    }

    let pageFlip = null;

    function calcPageSize() {
      const availW = window.innerWidth - 60;
      const controlsEl = document.querySelector('.controls');
      const controlsH = controlsEl ? controlsEl.offsetHeight + 20 : 40;
      const availH = window.innerHeight - 60 - controlsH;
      const isMobile = availW < 600;
      const ratioWH = BOOK_RATIO_W / BOOK_RATIO_H;
      let pageWidth = isMobile
        ? Math.min(availW, availH * ratioWH)
        : Math.min(availW / 2, availH * ratioWH);
      pageWidth = Math.max(pageWidth, 100);
      const pageHeight = pageWidth * (BOOK_RATIO_H / BOOK_RATIO_W);
      return { width: pageWidth, height: pageHeight, isMobile };
    }

    function initBook() {
      buildPages();
      const size = calcPageSize();

      if (pageFlip) {
        try { pageFlip.destroy(); } catch(e) {}
        pageFlip = null;
      }

      pageFlip = new St.PageFlip(
        document.getElementById('book'),
        {
          width: size.width,
          height: size.height,
          size: 'fixed',
          showCover: true,
          drawShadow: true,
          flippingTime: 800,
          usePortrait: size.isMobile && (BOOK_RATIO_H > BOOK_RATIO_W),
          maxShadowOpacity: 0.5,
          mobileScrollSupport: true
        }
      );
      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
      // 翻页完成自动更新页码
      pageFlip.on('flip', () => {
        updateNum();
        checkMusicStart();
      });
      updateNum();
    }

    function updateNum() {
      if (!pageFlip) return;
      const cur = pageFlip.getCurrentPageIndex();
      const total = pageFlip.getPageCount();
      // 封面从0开始：封面0/4，内页1-2/4，封底4/4
      if (cur === 0) {
        document.getElementById('pageNum').textContent = '0 / ' + total;
      } else if (cur === total - 1) {
        document.getElementById('pageNum').textContent = total + ' / ' + total;
      } else {
        document.getElementById('pageNum').textContent = cur + '-' + (cur + 1) + ' / ' + total;
      }
      updateBlankPageVisibility(cur, total);
    }

    function updateBlankPageVisibility(cur, total) {
      const book = document.getElementById('book');
      if (!book) return;
      book.querySelectorAll('.page').forEach(p => {
        p.style.background = '';
        p.style.boxShadow = '';
      });
      if (cur === 0) {
        const left = book.querySelector('.page.--left');
        if (left) {
          left.style.background = 'transparent';
          left.style.boxShadow = 'none';
        }
      }
      if (cur === total - 1) {
        const right = book.querySelector('.page.--right');
        if (right) {
          right.style.background = 'transparent';
          right.style.boxShadow = 'none';
        }
      }
    }

    function checkMusicStart() {
      if (!window.bgMusic || window.musicStarted) return;
      const music = window.musicConfig || {};
      const curPage = pageFlip ? pageFlip.getCurrentPageIndex() + 1 : 1;
      if (curPage >= (music.startPage || 1)) {
        window.musicStarted = true;
        const tryPlay = () => {
          window.bgMusic.play().then(() => {
            console.log('音乐开始播放');
          }).catch(() => {
            setTimeout(tryPlay, 300);
          });
        };
        tryPlay();
      }
    }

    function nextPage() {
      pageFlip.flipNext('bottom');
    }
    function prevPage() {
      pageFlip.flipPrev('bottom');
    }

    // ==========================================
    //  分享：生成 8 位短码并复制短链接
    //  短链接格式：域名/s/<短码>，由 Nginx rewrite 映射到画册页
    //  短码存于 config.shareCode，首次生成后复用；写库失败降级为完整链接
    // ==========================================
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // 字符集去掉易混淆的 0/o、1/l/i
    const SHORT_CODE_CHARS = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
    function genShortCode(len) {
      let s = '';
      for (let i = 0; i < len; i++) {
        s += SHORT_CODE_CHARS[Math.floor(Math.random() * SHORT_CODE_CHARS.length)];
      }
      return s;
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch(e) {
        return false;
      }
    }

    async function shareBook() {
      if (!currentBookId) {
        showToast('画册尚未加载');
        return;
      }
      try {
        // 已有短码则复用，没有则生成并存库
        let code = CONFIG && CONFIG.shareCode;
        if (!code) {
          code = genShortCode(8);
          const newConfig = JSON.parse(JSON.stringify(CONFIG));
          newConfig.shareCode = code;
          const { error } = await supabase
            .from('books')
            .update({ config: newConfig, updated_at: new Date().toISOString() })
            .eq('id', currentBookId);
          if (error) throw error;
          CONFIG.shareCode = code;
        }
        const ok = await copyText(location.origin + '/s/' + code);
        showToast(ok ? '复制链接成功' : '复制失败，请手动复制');
      } catch(e) {
        // 短码写入失败：降级复制完整链接
        const ok = await copyText(location.origin + '/book-ratio-adaptive.html?book=' + currentBookId);
        showToast(ok ? '短链接生成失败，已复制完整链接' : '复制失败，请手动复制');
      }
    }

    applyBackground();
    initBook();

    const params = new URLSearchParams(window.location.search);
    const goTo = parseInt(params.get('page'));
    if (!isNaN(goTo) && pageFlip) {
      setTimeout(() => {
        let cur = pageFlip.getCurrentPageIndex();
        while (cur > 0) {
          pageFlip.flipPrev('top');
          cur--;
        }
        for (let i = 0; i < goTo; i++) {
          pageFlip.flipNext('top');
        }
        updateNum();
      }, 300);
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        initBook();
      }, 300);
    });
  </script>

</body>
</html>
