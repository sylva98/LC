<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LC</title>
  <link href="page-flip.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      background: #e8e8e8;
      font-family: "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      height: 100%;
    }

    .page-wrapper {
      padding: 20px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #book {
      background: transparent;
      border-radius: 2px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      margin: 0 auto;
    }

    .page { background: #fff; overflow: hidden; position: relative; }
    .page.--left::after,
    .page.--right::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30px;
      pointer-events: none;
      z-index: 10;
    }
    .page.--left::after {
      right: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.15), transparent);
    }
    .page.--right::after {
      left: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.15), transparent);
    }

    .page-image-only { background: #e5e5e5; }
    .page-image-only img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .page-img { opacity: 0; transition: opacity .5s ease, filter .5s ease; }
    .page-img.blur { opacity: 1; filter: blur(10px); transform: scale(1.06); }
    .page-html-content { width: 100%; height: 100%; overflow-y: auto; }

    .controls { margin-top: 20px; display: flex; gap: 16px; align-items: center; }
    .controls button {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid #999; background: rgba(255,255,255,0.9);
      color: #666; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .controls button:active { background: #333; color: #fff; transform: scale(0.95); }
    .page-num { font-size: 12px; color: #999; letter-spacing: 2px; min-width: 50px; text-align: center; }
    .tip { margin-top: 15px; font-size: 11px; color: #aaa; text-align: center; }
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; letter-spacing: 1px;
      opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 1000;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }
  </style>
</head>

    <div style="width:32px; height:32px; border:2px solid #ddd; border-top-color:#999; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <div style="font-size:13px; color:#999; letter-spacing:2px;">加载中</div>
  </div>

    // ==========================================
    //  配置：从 Supabase 读取
    // ==========================================
    const DEFAULT_CONFIG = {
      background: { type: 'color', color: '#e8e8e8', image: '' },
      bookRatio: { w: 420, h: 560 },
      cover: { type: 'image', image: '', html: '' },
      pages: [
        { type: 'image', src: '' },
        { type: 'image', src: '' },
        { type: 'image', src: '' }
      ],
      backCover: { type: 'image', image: '', html: '' }
    };

    async function loadConfig() {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('book');
      const shortCode = params.get('s');
      currentBookId = bookId || null;
      try {
        // 短链接：/s/<8位短码>，按 config.shareCode 查
        if (shortCode) {
          const { data, error } = await supabase
            .from('books')
            .select('id, name, config')
            .eq('config->>shareCode', shortCode)
            .maybeSingle();
          if (!error && data && data.config) {
            currentBookId = data.id;
            document.title = data.name || '画册';
            return data.config;
          }
          // 兼容旧版短链接 /s/<UUID>：短码查不到且形如 UUID 时，按完整 id 查
          if (shortCode.indexOf('-') > 0) {
            const { data: d2, error: e2 } = await supabase
              .from('books')
              .select('id, name, config')
              .eq('id', shortCode)
              .maybeSingle();
            if (!e2 && d2 && d2.config) {
              currentBookId = d2.id;
              document.title = d2.name || '画册';
              return d2.config;
            }
          }
        }
        // 常规链接：?book=<UUID>
        if (bookId) {
          const { data, error } = await supabase
            .from('books')
            .select('name, config')
            .eq('id', bookId)
            .single();
          if (data && data.config) {
            document.title = data.name || '画册';
            return data.config;
          }
        }
      } catch(e) {}
      // 无参数或画册不存在/查询失败：返回 null，由 init 显示友好提示（而不是空白画册）
      return null;
    }

    function buildPagesFromConfig(cfg) {
      const pages = [];
      pages.push({
        type: cfg.cover.type,
        src: cfg.cover.image,
        html: cfg.cover.html,
        hard: true
      });
      cfg.pages.forEach(p => {
        pages.push({
          type: p.type,
          src: p.src,
          html: p.html
        });
      });
      pages.push({
        type: cfg.backCover.type,
        src: cfg.backCover.image,
        html: cfg.backCover.html,
        hard: true
      });
      return pages;
    }

    function thumbFor(src) {
      if (typeof src !== 'string') return null;
      return THUMB_BASE64[src.split('/').pop()] || null;
    }

    let pageImgs = [];      // 每页 <img> 引用
    let loadedFlags = {};   // 已请求加载原图的页索引（幂等）

    // 请求加载某页原图：完成后平滑替换占位图（模糊 -> 清晰）
    function ensureLoaded(i) {
      const img = pageImgs[i];
      if (!img || loadedFlags[i]) return;
      loadedFlags[i] = true;
      const src = img.getAttribute('data-src');
      if (!src) { img.style.opacity = 1; return; }
      const full = new Image();
      full.onload = () => {
        if (img.src !== src) {
          img.src = src;
          img.classList.remove('blur');
        }
        img.style.opacity = 1;
      };
      full.onerror = () => { img.style.opacity = 1; };
      full.src = src;
    }

    // 预取策略：当前屏 + 相邻页
    function preloadAround() {
      if (!pageFlip) return;
      const cur = pageFlip.getCurrentPageIndex();
      if (isSinglePage) {
        ensureLoaded(cur); ensureLoaded(cur + 1); ensureLoaded(cur - 1);
      } else {
        ensureLoaded(cur); ensureLoaded(cur + 1); ensureLoaded(cur + 2);
        if (cur > 0) ensureLoaded(cur - 1);
      }
    }

    let CONFIG, BOOK_RATIO_W, BOOK_RATIO_H, PAGES, currentBookId = null;

    function applyBackground() {
      const bg = CONFIG.background || {};
      if (bg.type === 'color') {
        document.body.style.background = bg.color;
      } else if (bg.type === 'image' && bg.image) {
        document.body.style.background = `url(${bg.image}) center/cover no-repeat`;
      }
    }

    async function init() {
      try {
        CONFIG = await loadConfig();

        // 无参数 / 画册不存在 / 查询失败：给出明确提示，而不是空白画册
        if (!CONFIG) {
          document.getElementById('loading').innerHTML =
            '<div style="text-align:center; color:#666; font-size:15px; line-height:2;">' +
            '未找到画册，请从首页选择后打开<br>' +
            '<a href="index.html" style="display:inline-block; margin-top:12px; padding:10px 28px; background:#1a1a1a; color:#fff; border-radius:20px; text-decoration:none; font-size:14px;">返回首页</a>' +
            '</div>';
          return;
        }

        // 判断当前设备是否允许访问
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const showOn = CONFIG.showOn || { mobile: true, pc: true };
        const allowed = isMobile ? showOn.mobile !== false : showOn.pc !== false;

        if (!allowed) {
          document.getElementById('loading').innerHTML = '<div style="color:#999; font-size:14px;">当前设备无法查看此画册</div>';
          return;
        }

        BOOK_RATIO_W = CONFIG.bookRatio.w;
        BOOK_RATIO_H = CONFIG.bookRatio.h;
        PAGES = buildPagesFromConfig(CONFIG);

        applyBackground();
        // 首页图标按钮：config.showIndexIcon 为 false 时隐藏（默认显示）
        const homeBtn = document.getElementById('homeBtn');
        if (homeBtn) homeBtn.style.display = (CONFIG.showIndexIcon === false) ? 'none' : '';
        // 立即开书（缩略图占位已可见），图片按需预加载，不再等全部加载完
        initBook();
        const l = document.getElementById('loading');
        if (l) l.style.display = 'none';
        preloadAround();
        // 从 URL 参数读要跳转的页码
        const params = new URLSearchParams(window.location.search);
        const goTo = parseInt(params.get('page'));
        if (!isNaN(goTo) && pageFlip) {
          setTimeout(() => {
            let cur = pageFlip.getCurrentPageIndex();
            while (cur > 0) {
              pageFlip.flipPrev('top');
              cur--;
            }
            for (let i = 0; i < goTo; i++) {
              pageFlip.flipNext('top');
            }
            updateNum();
            preloadAround();
          }, 300);
        }

        // 初始化背景音乐
        const music = CONFIG.music || {};
        window.musicConfig = music;
        window.bgMusic = document.getElementById('bgMusic');
        if (music.url) {
          window.bgMusic.src = music.url;
          window.bgMusic.volume = music.volume || 0.5;
        }
        window.musicStarted = false;
      } finally {
        // 兜底：无论成功与否，最多 10 秒隐藏 loading（正常路径在图片加载后已更早隐藏）
        setTimeout(() => {
          const l = document.getElementById('loading');
          if (l) l.style.display = 'none';
        }, 10000);
      }
    }

    init();

    function buildPages() {
      let bookEl = document.getElementById('book');
      if (!bookEl) {
        bookEl = document.createElement('div');
        bookEl.id = 'book';
        const controls = document.querySelector('.controls');
        document.querySelector('.page-wrapper').insertBefore(bookEl, controls);
      }
      bookEl.innerHTML = '';
      PAGES.forEach(p => {
        const div = document.createElement('div');
        div.className = 'page';
        if (p.hard) div.setAttribute('data-density', 'hard');
        if (p.type === 'image') {
          div.className += ' page-image-only';
          const thumb = thumbFor(p.src);
          div.innerHTML = `<img class="page-img${thumb ? ' blur' : ''}" data-src="${p.src}" src="${thumb || ''}" alt="">`;
        } else {
          div.className += ' page-html-content';
          div.innerHTML = p.html;
        }
        bookEl.appendChild(div);
      });
    }

    let pageFlip = null;
    let isSinglePage = false; // 移动端单页模式标记（页码显示用）

    function calcPageSize() {
      const availW = window.innerWidth - 60;
      const controlsEl = document.querySelector('.controls');
      const controlsH = controlsEl ? controlsEl.offsetHeight + 20 : 40;
      const availH = window.innerHeight - 60 - controlsH;
      const isMobile = availW < 600;
      const ratioWH = BOOK_RATIO_W / BOOK_RATIO_H;
      let pageWidth = isMobile
        ? Math.min(availW, availH * ratioWH)
        : Math.min(availW / 2, availH * ratioWH);
      pageWidth = Math.max(pageWidth, 100);
      const pageHeight = pageWidth * (BOOK_RATIO_H / BOOK_RATIO_W);
      return { width: pageWidth, height: pageHeight, isMobile };
    }

    function initBook() {
      loadedFlags = {};   // resize 重建后重新按需加载（浏览器缓存保证快速）
      buildPages();
      pageImgs = Array.from(document.querySelectorAll('#book .page-img'));
      const size = calcPageSize();

      if (pageFlip) {
        try { pageFlip.destroy(); } catch(e) {}
        pageFlip = null;
      }

      // 移动端统一单页模式（usePortrait），横版竖版画册在手机上都是一页一页翻
      isSinglePage = size.isMobile;
      pageFlip = new St.PageFlip(
        document.getElementById('book'),
        {
          width: size.width,
          height: size.height,
          size: 'fixed',
          showCover: true,
          drawShadow: true,
          flippingTime: 800,
          usePortrait: isSinglePage,
          maxShadowOpacity: 0.5,
          mobileScrollSupport: true
        }
      );
      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
      // 翻页完成自动更新页码
      pageFlip.on('flip', () => {
        updateNum();
        checkMusicStart();
        preloadAround();
      });
      updateNum();
      preloadAround();
    }

    function updateNum() {
      if (!pageFlip) return;
      const cur = pageFlip.getCurrentPageIndex();
      const total = pageFlip.getPageCount();
      if (isSinglePage) {
        // 移动端单页模式：封面 1/5，内页逐页 2/5、3/5……
        document.getElementById('pageNum').textContent = Math.min(cur + 1, total) + ' / ' + total;
        return;
      }
      // 封面从0开始：封面0/4，内页1-2/4，封底4/4
      if (cur === 0) {
        document.getElementById('pageNum').textContent = '0 / ' + total;
      } else if (cur === total - 1) {
        document.getElementById('pageNum').textContent = total + ' / ' + total;
      } else {
        document.getElementById('pageNum').textContent = cur + '-' + (cur + 1) + ' / ' + total;
      }
      updateBlankPageVisibility(cur, total);
    }

    function updateBlankPageVisibility(cur, total) {
      const book = document.getElementById('book');
      if (!book) return;
      book.querySelectorAll('.page').forEach(p => {
        p.style.background = '';
        p.style.boxShadow = '';
      });
      if (cur === 0) {
        const left = book.querySelector('.page.--left');
        if (left) {
          left.style.background = 'transparent';
          left.style.boxShadow = 'none';
        }
      }
      if (cur === total - 1) {
        const right = book.querySelector('.page.--right');
        if (right) {
          right.style.background = 'transparent';
          right.style.boxShadow = 'none';
        }
      }
    }

    function checkMusicStart() {
      if (!window.bgMusic || window.musicStarted) return;
      const music = window.musicConfig || {};
      const curPage = pageFlip ? pageFlip.getCurrentPageIndex() + 1 : 1;
      if (curPage >= (music.startPage || 1)) {
        window.musicStarted = true;
        const tryPlay = () => {
          window.bgMusic.play().then(() => {
            console.log('音乐开始播放');
          }).catch(() => {
            setTimeout(tryPlay, 300);
          });
        };
        tryPlay();
      }
    }

    function nextPage() {
      pageFlip.flipNext('bottom');
    }
    function prevPage() {
      pageFlip.flipPrev('bottom');
    }

    // ==========================================
    //  分享：生成 8 位短码并复制短链接
    //  短链接格式：域名/s/<短码>，由 Nginx rewrite 映射到画册页
    //  短码存于 config.shareCode，首次生成后复用；写库失败降级为完整链接
    // ==========================================
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // 字符集去掉易混淆的 0/o、1/l/i
    const SHORT_CODE_CHARS = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
    function genShortCode(len) {
      let s = '';
      for (let i = 0; i < len; i++) {
        s += SHORT_CODE_CHARS[Math.floor(Math.random() * SHORT_CODE_CHARS.length)];
      }
      return s;
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch(e) {
        return false;
      }
    }

    async function shareBook() {
      if (!currentBookId) {
        showToast('画册尚未加载');
        return;
      }
      try {
        // 已有短码则复用，没有则生成并存库
        let code = CONFIG && CONFIG.shareCode;
        if (!code) {
          code = genShortCode(8);
          const newConfig = JSON.parse(JSON.stringify(CONFIG));
          newConfig.shareCode = code;
          const { error } = await supabase
            .from('books')
            .update({ config: newConfig, updated_at: new Date().toISOString() })
            .eq('id', currentBookId);
          if (error) throw error;
          CONFIG.shareCode = code;
        }
        const ok = await copyText(location.origin + '/s/' + code);
        showToast(ok ? '复制链接成功' : '复制失败，请手动复制');
      } catch(e) {
        // 短码写入失败：降级复制完整链接
        const ok = await copyText(location.origin + '/book-ratio-adaptive.html?book=' + currentBookId);
        showToast(ok ? '短链接生成失败，已复制完整链接' : '复制失败，请手动复制');
      }
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        initBook();
      }, 300);
    });
  </script>

</body>
