<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LC</title>
  <link href="page-flip.css" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="css/reader.css">
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中</div>
  </div>

  <div class="page-wrapper">
    <div id="book"></div>
    <div class="controls">
      <button id="homeBtn" onclick="window.location.href='index.html'" title="返回首页">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button onclick="prevPage()">‹</button>
      <div class="page-num" id="pageNum"></div>
      <button onclick="nextPage()">›</button>
      <button id="shareBtn" onclick="shareBook()" title="分享画册">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="supabase.min.js"></script>
  <script src="common.js"></script>
  <audio id="bgMusic" loop preload="auto" class="audio-hidden"></audio>
  <script src="page-flip.browser.min.js"></script>
  <script src="js/reader.js"></script>

</body>
</html>
